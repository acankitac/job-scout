# job-scout configuration template. Copy to config.toml (git-ignored) and edit:
#   cp config.example.toml config.toml
#
# job-scout configuration. Every field in [criteria] can also be overridden on the command line
# for a single run: see ./scout.py --help

[criteria]
# A job passes if its location contains any of these (case-insensitive substring match).
locations = ["Berlin", "Germany", "Deutschland"]
exclude_locations = []

# Remote jobs pass only if their location also names one of these regions.
allow_remote = true
remote_regions = ["Europe", "EMEA", "EU", "Germany", "CET", "Worldwide", "Anywhere"]
# A bare "Remote" with no region is usually US-only at US companies, so it's off by default.
include_unscoped_remote = false

# Regexes, case-insensitive, matched against the job title.
title_include = [
  "software engineer", "backend", "back-end", "back end", "platform engineer",
  "distributed systems", "infrastructure engineer", "systems engineer", "software developer",
  "data engineer", "developer", "entwickler", "software architect", "softwarearchitekt",
]
# Seniority words (senior, staff, principal, lead, junior) are deliberately NOT excluded here:
# titles are unreliable signals of level, so experience fit is judged from the job description
# instead (see max_years_required below). Exclude role types you don't want, not levels.
title_exclude = [
  "director", "head of", "\\bvp\\b", "manager",
  "intern", "working student", "werkstudent", "praktik", "ausbildung", "duales studium",
  "trainee", "abschlussarbeit", "thesis", "freelance", "freiberuf",
  "front[- ]?end", "ios", "android", "mobile", "designer", "sales", "solutions",
  "support", "customer success", "account executive", "recruit", "scientist", "research", "security analyst",
  "qa\\b", "test automation", "sre\\b", "site reliability",
]

# Annual base salary in EUR. 0 disables that bound, so with only salary_min_eur set there is
# no upper limit. salary_max_eur drops roles whose pay *floor* is above it (rarely useful).
# Roles that don't list pay are estimated (see [profile], [negotiation], [research] below)
# and judged by what's reachable with negotiation; with no estimate they are kept.
# require_salary = true drops every role that doesn't list pay instead.
salary_min_eur = 0
salary_max_eur = 0
require_salary = false

# Drop postings older than this many days (0 = no limit). Everything on these boards is still
# open, and many good roles stay listed for months, so this is off by default. Use the 🆕
# marker (or --new-only) to see what appeared since your last run instead.
max_age_days = 0

# Experience fit, judged from the job description ("5+ years of experience", "3-5 years",
# "mindestens 5 Jahre"). If the description doesn't say, the typical experience for the
# company's level for that role is researched (needs ANTHROPIC_API_KEY, see [research]);
# without research the role is kept and shown as "?".
# Drop roles that expect more than this many years (0 = no limit):
max_years_required = 7
# Drop roles aimed at people with fewer than this many years, e.g. "0-2 years" (0 = no limit):
min_years_expected = 3

# Relevance scoring: weight per keyword found in the description; doubled if in the title.
min_score = 4
[criteria.keywords]
"backend" = 4
"back-end" = 4
"distributed systems" = 4
"distributed" = 2
"java" = 3
"kotlin" = 3
"go" = 1
"golang" = 3
"python" = 2
"microservices" = 2
"api" = 1
"grpc" = 2
"graphql" = 1
"kafka" = 3
"spark" = 2
"aws" = 2
"postgresql" = 2
"postgres" = 2
"dynamodb" = 1
"kubernetes" = 1
"event-driven" = 2
"scalab" = 1
"data pipeline" = 1
"senior" = 1

# Rough conversion rates to EUR, used for the salary filter. Update occasionally.
[criteria.fx_to_eur]
EUR = 1.0
USD = 0.86
GBP = 1.16
CHF = 1.07
SEK = 0.091
DKK = 0.134
NOK = 0.086
PLN = 0.235

# How roles that don't list pay are handled when salary_min_eur is set.
[salary_check]
# Roles with no listed salary, no estimate, and not a known high payer:
#   "separate"  list them in their own "Salary not verified" section (default)
#   "keep"      keep them in the main list
#   "drop"      leave them out
unverified = "separate"
# Official German pay statistics (Bundesagentur Entgeltatlas) by role level and region. A role is
# marked "unlikely" when a typical offer would need to sit above this percentile of the market,
# before negotiation, to reach your minimum.
market_data = true
unlikely_above_percentile = 75
# Employers you know pay at your level. Kept in the main list even without salary data.
high_payers = []

# ---------------------------------------------------------------------------------------
# Market-wide search (the default). Searches job boards across the whole market rather than
# a fixed company list. Use --companies to search only the [[companies]] boards below, or
# --all-sources for both.
#   arbeitsagentur  Germany's federal job board; most jobs posted in Germany, often with salary
#   arbeitnow       tech and English-speaking jobs in Germany/Europe
#   remotive        remote jobs worldwide
#   adzuna          large aggregator; needs a free key (ADZUNA_APP_ID, ADZUNA_APP_KEY), skipped without
# ---------------------------------------------------------------------------------------
[generic]
sources = ["arbeitsagentur", "arbeitnow", "remotive", "adzuna"]
# Search terms, sent to each source. German terms matter: many German postings use them.
queries = ["backend engineer", "software engineer", "backend developer", "platform engineer",
           "softwareentwickler backend", "java entwickler", "golang"]
where = ["Berlin"]           # places to search around (sources that support location search)
radius_km = 30
max_pages = 3                # result pages per query and place
arbeitnow_pages = 5          # arbeitnow has no search; this many pages are scanned and filtered
max_detail_fetches = 250     # full descriptions fetched per run, for sources that need it
adzuna_country = "de"

# ---------------------------------------------------------------------------------------
# Salary estimation for roles that don't list pay. Used only when salary_min_eur or
# salary_max_eur is set (or with --research).
# ---------------------------------------------------------------------------------------

# Who the estimate is for: pay depends on your level and the country you'd be employed in.
[profile]
years_experience = 5
city = "Berlin"
country = "Germany"
currency = "EUR"
# Location words that count as this country when reusing a company's other salaried postings.
country_aliases = ["Deutschland", "Munich", "München", "Hamburg", "Frankfurt", "Cologne", "Köln", "Stuttgart", "Düsseldorf", "Leipzig"]

# How far above a typical offer negotiation usually gets you on base salary, by how
# negotiable the company is. Research reports each company's room; "default" is used
# when it's unknown. A role passes your minimum if typical + headroom (capped at the top
# of the band) reaches it.
[negotiation]
default_headroom_pct = 10
low = 3        # fixed or formula-based pay
medium = 8
high = 15      # offers routinely negotiated up

# Web research with Claude, restricted to trusted salary and career-data sources, for what a
# posting doesn't state: pay, and the experience a role expects.
# Each lookup costs roughly $0.05–0.20. Results are cached (salary per company + level +
# country, experience per company + title), so only the first run costs anything.
[research]
enabled = true
# Backends, tried in order. A backend is skipped for the rest of the run if its credentials
# are missing or expired, the model isn't enabled, or it can't run the web-search tool.
providers = ["bedrock", "anthropic"]
# Amazon Bedrock: an AWS profile from ~/.aws/credentials with bedrock:InvokeModel access.
bedrock_profile = "bedrock"
bedrock_region = "us-west-2"
bedrock_model_id = "auto"        # "auto" = newest Claude Sonnet inference profile in the region
# Anthropic API: reads ANTHROPIC_API_KEY from the environment.
model = "claude-sonnet-5"
# If no backend can web-search, answer from model knowledge instead? Such answers have no
# sources, are marked "model knowledge (no web search)" with low confidence, and can reject
# roles, so this is off by default.
allow_without_web_search = false
experience = true                    # research experience when the JD doesn't state it
# Lookups per run, per backend; 0 = unlimited. Bedrock is limited only by your account's own
# quotas (throttling is retried). The Anthropic fallback is capped to keep its bill predictable.
caps = { bedrock = 0, anthropic = 20 }
concurrency = 4                      # lookups run in parallel
max_searches_per_lookup = 5
cache_days = 30
trusted_domains = [
  "levels.fyi", "glassdoor.com", "glassdoor.de", "glassdoor.co.uk", "kununu.com",
  "stepstone.de", "gehalt.de", "indeed.com", "payscale.com", "teamblind.com",
  "arbeitsagentur.de",
]   # the company's own domain is always added

[hunter]
per_company = 5     # recruiter contacts listed per company
max_lookups_per_run = 10  # new companies looked up per run, best matches first (free plan: ~25/month)
cache_days = 30     # Hunter results are cached per domain for this long

# Pre-filled search used for the "check by hand" links (LinkedIn Jobs, career sites).
[search]
query = "backend engineer"
location = "Berlin"

# ---------------------------------------------------------------------------------------
# Specific companies' job boards. Used only with --companies or --all-sources.
# Companies with a public ATS job board. `ats` is greenhouse, ashby or lever; `token` is the
# board slug from their careers URL (e.g. job-boards.greenhouse.io/<token>). `domain` is used
# for the recruiter email lookup. See INSTRUCTIONS.md, step 5, for how to find these.
# ---------------------------------------------------------------------------------------

[[companies]]
name = "ExampleCorp"
ats = "greenhouse"        # job URL: job-boards.greenhouse.io/examplecorp/jobs/...
token = "examplecorp"
domain = "examplecorp.com"

[[companies]]
name = "SampleLabs"
ats = "ashby"             # job URL: jobs.ashbyhq.com/samplelabs/...
token = "samplelabs"
domain = "samplelabs.io"

[[companies]]
name = "DemoSoft"
ats = "lever"             # job URL: jobs.lever.co/demosoft/...
token = "demosoft"
domain = "demosoft.com"

# ---------------------------------------------------------------------------------------
# Career sites with no public API. Listed in the report as pre-filled search links.
# {query} and {location} come from [search].
# ---------------------------------------------------------------------------------------

[[manual]]
name = "BigTechCo"
url = "https://careers.bigtechco.com/search?q={query}&location={location}"
